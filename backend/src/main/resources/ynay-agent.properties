# Import agent settings (see docs/IMPORT_AGENT.md). Loaded by io.ynay.agent.AgentConfiguration with
# the lowest precedence, so application.yml, env vars and test properties can override ynay.agent.*.
ynay.agent.provider=${YNAY_AGENT_PROVIDER:anthropic}
ynay.agent.api-key=${YNAY_AGENT_API_KEY:}
ynay.agent.model=${YNAY_AGENT_MODEL:}
ynay.agent.base-url=${YNAY_AGENT_BASE_URL:}
ynay.agent.max-iterations=${YNAY_AGENT_MAX_ITERATIONS:25}
ynay.agent.max-tokens=${YNAY_AGENT_MAX_TOKENS:16000}
ynay.agent.effort=${YNAY_AGENT_EFFORT:medium}
ynay.agent.refusal-fallback=${YNAY_AGENT_REFUSAL_FALLBACK:true}
ynay.agent.request-timeout=${YNAY_AGENT_TIMEOUT:10m}
ynay.agent.allow-destructive=${YNAY_AGENT_ALLOW_DESTRUCTIVE:false}
